<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>משימת כרטיס גירוד</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Assistant', sans-serif;
            background-color: #f3f4f6;
            overflow: hidden;
            touch-action: none;
        }
        .scratch-container {
            position: relative;
            user-select: none;
            -webkit-user-select: none;
        }
        canvas {
            cursor: crosshair;
            touch-action: none;
            border-radius: 1rem;
        }
        .reveal-animation {
            animation: bounceIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.05); opacity: 1; }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full text-center">
        <h1 class="text-3xl font-bold text-slate-800 mb-4">משימת גילוי הקוד</h1>
        <p class="text-slate-600 mb-6 font-medium">גרדו את כל המשטח האפור כדי לחשוף את ההפתעה והקוד!</p>

        <!-- אזור הכרטיס -->
        <div class="relative mx-auto w-80 h-80 sm:w-96 sm:h-96 bg-white rounded-2xl shadow-xl border-4 border-white scratch-container">
            
            <!-- תמונת הרקע המסתתרת - וודא ששם הקובץ בגיטהאב הוא pic.png -->
            <img src="pic.png" alt="[Image of pic.png]" id="prize-image" 
                 class="absolute inset-0 w-full h-full object-cover rounded-xl select-none"
                 onerror="this.src='https://via.placeholder.com/400x400?text=%D7%97%D7%A1%D7%A8+%D7%A7%D7%95%D7%91%D7%A5+pic.png'">
            
            <!-- שכבת הגירוד -->
            <canvas id="scratch-canvas" class="absolute inset-0 z-10"></canvas>
        </div>

        <!-- הודעת הצלחה וקוד -->
        <div id="success-overlay" class="mt-8 hidden">
            <div class="bg-indigo-600 text-white p-6 rounded-2xl shadow-2xl reveal-animation">
                <h2 class="text-2xl font-bold mb-2 text-white">כל הכבוד!</h2>
                <p class="text-lg opacity-90 mb-4 text-white">הקוד הוא:</p>
                <div class="text-7xl font-black tracking-widest text-yellow-300">247</div>
            </div>
        </div>
    </div>

    <!-- צליל תרועת ניצחון -->
    <audio id="victory-sound" src="https://assets.mixkit.co/active_storage/sfx/2018/2018-preview.mp3" preload="auto"></audio>

    <script>
        const canvas = document.getElementById('scratch-canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const successOverlay = document.getElementById('success-overlay');
        const victorySound = document.getElementById('victory-sound');
        
        let isDrawing = false;
        let isFinished = false;
        let lastX = 0;
        let lastY = 0;
        
        // הגדרת עובי המברשת
        const brushRadius = 35;

        function init() {
            // התאמת גודל הקנבס למכולה שלו
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;

            // יצירת שכבת הכיסוי האפורה
            ctx.globalCompositeOperation = 'source-over';
            
            const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            gradient.addColorStop(0, '#9ca3af');
            gradient.addColorStop(0.5, '#4b5563');
            gradient.addColorStop(1, '#1f2937');
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // הוספת טקסט הנחיה על השכבה
            ctx.font = 'bold 28px Assistant';
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('גרד את כל השטח!', canvas.width / 2, canvas.height / 2);

            // הגדרת מצב הגירוד (מחיקה)
            ctx.globalCompositeOperation = 'destination-out';
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            ctx.lineWidth = brushRadius * 2;
        }

        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        function startDrawing(e) {
            if (isFinished) return;
            isDrawing = true;
            const pos = getMousePos(e);
            lastX = pos.x;
            lastY = pos.y;
            draw(e);
        }

        function draw(e) {
            if (!isDrawing || isFinished) return;
            e.preventDefault();

            const pos = getMousePos(e);
            
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();

            lastX = pos.x;
            lastY = pos.y;

            // בדיקת התקדמות הגירוד
            checkProgress();
        }

        function stopDrawing() {
            isDrawing = false;
        }

        function checkProgress() {
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const pixels = imageData.data;
            let transparentPixels = 0;

            for (let i = 3; i < pixels.length; i += 4) {
                if (pixels[i] === 0) {
                    transparentPixels++;
                }
            }

            const totalPixels = pixels.length / 4;
            const progress = (transparentPixels / totalPixels) * 100;

            // הגדרתי 98% כדי למנוע תסכול של פיקסלים בודדים בפינות
            if (progress >= 98 && !isFinished) {
                completeGame();
            }
        }

        function completeGame() {
            isFinished = true;
            
            // העלמת הקנבס לחלוטין
            canvas.style.transition = 'opacity 1s ease';
            canvas.style.opacity = '0';
            
            // השמעת סאונד
            victorySound.play().catch(e => console.log("Sound check: User interaction needed"));
            
            // הצגת הודעת ההצלחה
            setTimeout(() => {
                successOverlay.classList.remove('hidden');
                canvas.classList.add('hidden');
            }, 500);
        }

        canvas.addEventListener('mousedown', startDrawing);
        window.addEventListener('mousemove', draw);
        window.addEventListener('mouseup', stopDrawing);

        canvas.addEventListener('touchstart', startDrawing);
        canvas.addEventListener('touchmove', draw);
        canvas.addEventListener('touchend', stopDrawing);

        window.addEventListener('load', init);
    </script>
</body>
</html>
